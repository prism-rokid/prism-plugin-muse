name: Release Muse plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      PRISM_PLATFORM: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Verify tag and manifest version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pluginbridge-plugin.yaml)
          test "$GITHUB_REF_NAME" = "v${version}"
      - name: Build Muse WebView plugin
        run: ./build.sh
      - name: Package plugin
        shell: bash
        run: |
          mkdir -p release
          tar -C dist -czf "release/muse-$(sed -n 's/^version: *//p' pluginbridge-plugin.yaml)-${PRISM_PLATFORM}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate release metadata
        run: node scripts/create-release-metadata.mjs release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Muse $GITHUB_REF_NAME" --generate-notes
